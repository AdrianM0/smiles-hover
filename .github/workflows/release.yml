name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Package extension
        run: npx vsce package --out smiles-hover-${{ github.ref_name }}.vsix

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: smiles-hover-*.vsix
          generate_release_notes: true
