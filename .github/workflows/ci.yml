name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npx vsce package --out smiles-hover.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: smiles-hover-vsix
          path: smiles-hover.vsix
